# Copy this file to style-profile.yaml in a private application workspace.
# Capture stable preferences and approved examples, not accidental errors.

schema_version: 2

style_profile:
  language: de
  locale: de-DE
  tone: direct
  formality: professional_relaxed
  directness: high
  sentence_length: short_to_medium
  technical_depth: high
  enthusiasm: restrained
  self_promotion: moderate
  humor: minimal

  vocabulary:
    prefer:
      - konkrete Beispiele
      - technische Präzision
      - klare Sprache
      - Belege vor Behauptungen
    avoid:
      - übertriebene Begeisterung
      - Marketingsprache
      - generische KI-Formulierungen
      - übermäßige Adjektive

  preferred_patterns:
    - Mit der konkreten Relevanz für die Stelle beginnen.
    - Technologien und Projektkontexte nur mit Beleg nennen.
    - Aktive, präzise und unterschiedlich lange Sätze verwenden.

  avoid_patterns:
    - Mit großer Begeisterung
    - Mit großem Interesse habe ich Ihre Stellenausschreibung gelesen
    - spannende Herausforderung
    - dynamisches Team
    - innovatives Unternehmen
    - meine Leidenschaft
    - ich bin überzeugt davon
    - perfekte Ergänzung
    - optimal einbringen

document_styles:
  cv:
    perspective: implied_first_person
    sentence_fragments: allowed
    technical_density: high
    max_sentence_words: 28
  cover_letter:
    perspective: first_person
    paragraph_variation: natural
    technical_density: medium
    max_sentence_words: 32
  email:
    perspective: first_person
    length: very_short
    technical_density: low_to_medium
    max_sentence_words: 28
  linkedin:
    perspective: first_person
    self_promotion: moderate
    personal_context: allowed
    # Required for every document type; a missing value rejects the whole profile.
    technical_density: medium
    max_sentence_words: 30

personalization_levels:
  default: professional
  conservative:
    description: Traditionell, formell und zurückhaltend.
  professional:
    description: Klar, natürlich und geschäftlich.
  personal:
    description: Individueller, direkter und etwas persönlicher.

approved_examples: []
# Example fields: id, document_type, text, source_ref, notes.

rejected_examples: []
# Example fields: id, document_type, text, reason.

quality_thresholds:
  max_repeated_sentence_starts: 2
  max_avoid_pattern_matches: 0

review_workflow:
  default_mode: standard
  max_revision_cycles: 2
  prefer_independent_agents: true

language_quality:
  primary_backend: languagetool
  language: de-DE
  local_server: http://localhost:8010/v2/check
  hunspell_dictionary: de_DE
  allow_remote_service: false
  allowlist: []
